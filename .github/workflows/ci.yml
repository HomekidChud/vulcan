name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-selftest:
    runs-on: ubuntu-latest
    env:
      VULCAN_CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nodejs python3
      - name: Build
        run: cargo build --release
      - name: Selftest (C + JS + Python backends)
        run: ./target/release/vulcan selftest
